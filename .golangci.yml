version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    rules:
      # dev/ holds local test tools; fake ids need no cryptographic randomness.
      - path: ^dev/
        linters: [gosec]
        text: G404
  settings:
    errcheck:
      # Errors from Close on read paths carry no actionable information.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
